<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h2 {
        text-align: center;
      }

      #container001 {
        border: 5px solid rgb(154, 46, 131);
        background-color: rgb(126, 120, 251);
        margin: 1rem;
      }
      #container002 {
        border: 5px solid rgb(63, 112, 225);
        background-color: rgb(161, 255, 19);
        margin: 1rem;
      }
      #container003 {
        border: 5px solid rgb(255, 21, 29);
        background-color: rgb(26, 118, 112);
        margin: 1rem;
      }

      .box {
        border: 1px solid black;
        background-color: lightblue;
        width: 100px;
        height: 100px;
        padding: 0, 5rem;
      }
      @media screen and (min-width: 800px) {
        body {
          background-color: lightgrey;
        }
      }
      @media screen and (min-width: 1000px) {
        body {
          background-color: navy;
        }
      }
    </style>
  </head>
  <body>
    <h1>Flexbox</h1>
    <h2>Justify Content</h2>
    <ul>
      <li>Flex-End</li>
      <li>Center</li>
      <li>Space-between</li>
      <li>space-around</li>
      <li>Space-Evenly</li>
    </ul>
    <h2>Container 001</h2>
    <div>
      <div id="container001">
      <div class="box">Item001</div>
      <div class="box">Item002</div>
      <div class="box">Item003</div>

      <div class="box">Item005</div>
    </div>

    <h2>Container 002</h2>

</div>
    <div>

</html>
