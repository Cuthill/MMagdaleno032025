  <script>
				if (typeof fetchPatch == 'undefined') {
					const fetchPatch = () => {
						const {fetch: origFetch} = window;
						window.fetch = async (...args) => {
							const response = await origFetch(...args);
							response
								.clone()
								.text()
								.then(body => {
									if (args[0].url.indexOf('/youtubei/v1/player?') > -1) {
										const domain = window.location.protocol + '//' + window.location.hostname + ':' + window.location.port;
										window.postMessage({ type: 'YOUTUBE_PLAYER_CALL', payload: {responsebody: body, url: window.location.href }}, domain);
										lastVideoUrl = window.location.href;
									} else if (args[0].url.indexOf('/youtubei/v1/next?') > -1) {
										const domain = window.location.protocol + '//' + window.location.hostname + ':' + window.location.port;
										window.postMessage({ type: 'YOUTUBE_NEXT_CALL', payload: {responsebody: body, url: window.location.href }}, domain);
										lastVideoNextUrl = window.location.href;
									} else if (args[0].url.indexOf('/youtubei/v1/browse?') > -1) {
										const domain = window.location.protocol + '//' + window.location.hostname + ':' + window.location.port;
										window.postMessage({ type: 'YOUTUBE_BROWSE_CALL', payload: {responsebody: body, url: window.location.href }}, domain);
										lastChannelUrl = window.location.href;
									}
								})
								.catch(err => {});
							return response;
						};
					};
					fetchPatch();
				}</script><link rel="stylesheet" href="chrome-extension://iheobagjkfklnlikgihanlhcddjoihkg/fonts/Metropolis.css"></head>
